appId: com.dxm.agent.console
productName: DXM Agent Console
electronDist: ./node_modules/electron/dist
afterPack: scripts/prune-packaged-runtime.cjs
directories:
  output: ../../outputs/desktop-build
files:
  - src/**
  - package.json
  # Repository resource contract: app/frontend/dist/** and app/backend/src/**
  - ../frontend/dist/**
  - ../backend/src/**
extraResources:
  - from: ../../outputs/build-metadata/desktop-build-manifest.json
    to: build-metadata/desktop-build-manifest.json
  - from: ../../outputs/desktop-python-runtime
    to: app/backend/python-runtime
  - from: ../frontend/dist
    to: app/frontend/dist
  - from: ../backend/src
    to: app/backend/src
  - from: ../backend/.venv
    to: app/backend/.venv
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!Lib/site-packages/pytest/**"
      - "!Lib/site-packages/pytest-*.dist-info/**"
      - "!Lib/site-packages/_pytest/**"
      - "!Lib/site-packages/pip/**"
      - "!Lib/site-packages/pip-*.dist-info/**"
      - "!Lib/site-packages/setuptools/**"
      - "!Lib/site-packages/setuptools-*.dist-info/**"
      - "!Lib/site-packages/wheel/**"
      - "!Lib/site-packages/wheel-*.dist-info/**"
      - "!Lib/site-packages/__editable__.*"
  - from: ../../tools/probes
    to: tools/probes
  - from: ../../config
    to: config
win:
  executableName: DXM-Agent-Console
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: DXM-Agent-Console-${version}.${ext}
  signAndEditExecutable: false
  signDlls: false
portable:
  artifactName: DXM-Agent-Console-Portable-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
